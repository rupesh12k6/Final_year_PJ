server.port=${PORT:8082}
spring.application.name=${APP_NAME:college-b-university}

# PostgreSQL Database Configuration (Dedicated College B Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/college_b_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# College B JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:586E3272357538782F413F4428472B4B6250645367566B597033733676397924}
app.jwt.expiration-ms=900000
app.jwt.issuer=college-b
app.college.code=COLLEGE_B
app.college.name=College B University
app.cm.base-url=${APP_CM_BASE_URL:http://localhost:8095}
app.internal.api-key=${APP_INTERNAL_API_KEY:}
app.rate-limit.max-per-minute=${APP_RATE_LIMIT_MAX_PER_MINUTE:60}
